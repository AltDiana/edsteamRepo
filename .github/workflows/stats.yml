name: Stats

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
         contents: write
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
       
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Run script
        run: python ./stats.py

      - name: commit and Push cambios
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update stats
          commit_user_name: Diana Alt
          commit_user_email: diana.altamirano7@gmail.com
          commit_author: AltDiana
